# Crosswalk: Credential Commons  ->  Open Badges 3.0 / W3C Verifiable Credentials
# https://www.imsglobal.org/spec/ob/v3p0
# Status: starter mapping, v0.1. OB 3.0 Achievement is a VC credentialSubject.
standard: OpenBadges3
namespace: "https://purl.imsglobal.org/spec/ob/v3p0/context/"
prefix: ob
maps:
  - cc: cc:MicroCredential
    target: ob:Achievement
    confidence: high
    note: "achievementType = Micro-credential."
  - cc: schema:name
    target: ob:name
    confidence: high
  - cc: schema:description
    target: ob:description
    confidence: high
  - cc: schema:provider
    target: ob:creator
    confidence: medium
    note: "creator / issuer (Profile)."
  - cc: cc:learningOutcome
    target: ob:criteria
    confidence: low
    note: "OB3 criteria is narrative; outcomes map loosely. Prefer ob:alignment to a competency framework."
  - cc: dcterms:language
    target: ob:inLanguage
    confidence: high
  - cc: cc:ectsCredits
    target: ob:creditsAvailable
    confidence: low
    note: "ob:creditsAvailable is a bare number ('credit hours'); no unit or credit system is attached, so ECTS and EAP cannot be told apart. Carry the unit in ob:alignment or an extension where it matters."
  - cc: cc:Achievement
    target: ob:AchievementCredential
    confidence: high
    note: OB 3.0 AchievementCredential is a W3C Verifiable Credential; awardedTo maps to credentialSubject.
  - cc: cc:awards
    target: ob:achievement
    confidence: high
  - cc: cc:awardedTo
    target: ob:credentialSubject
    confidence: high
  - cc: cc:awardedDate
    target: ob:awardedDate
    confidence: high
  - cc: cc:evidence
    target: ob:evidence
    confidence: high
